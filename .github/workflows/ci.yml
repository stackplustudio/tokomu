name: CI Quality Gate

on:
  push:
    branches: [main, "chore/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-test-secret-at-least-32-characters-long!
      JWT_REFRESH_SECRET: ci-refresh-jwt-test-secret-32-characters!
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/testdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Versi pnpm dibaca dari field "packageManager" di package.json root.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify lockfile & install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migrations to CI test database
        run: pnpm --filter @cahyodev/database exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & Security Regression Tests (with coverage)
        run: pnpm test:cov

      - name: API E2E Tests (mocked DB)
        run: pnpm --filter api test:e2e

      - name: Production Build
        run: pnpm build

  docker-validate:
    name: Docker Build Validation
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: stackplus-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max